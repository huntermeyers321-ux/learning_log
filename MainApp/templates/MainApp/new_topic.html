{% extends "MainApp/base.html" %}

{% load bootstrap4 %}

{% block page_header %}
  <h2>Add a new topic</h2>
{% endblock page_header %}

{% block content %}

  <!-- action = where the form data is sent. method='post' = we are
       sending data to be saved, not just asking for a page. -->
  <form action="{% url 'MainApp:new_topic' %}" method='post'>
    <!-- csrf_token is Django's built-in protection against forged forms. -->
    {% csrf_token %}
    <!-- Draws every field of TopicForm with Bootstrap styling. -->
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Add topic" %}
  </form>

{% endblock content %}
