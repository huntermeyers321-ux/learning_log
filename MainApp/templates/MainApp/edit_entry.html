{% extends "MainApp/base.html" %}

{% load bootstrap4 %}

{% block page_header %}
  <h2><a href="{% url 'MainApp:topic' topic.id %}">{{ topic }}</a></h2>
{% endblock page_header %}

{% block content %}

  <p>Edit entry:</p>

  <!-- entry.id tells Django which entry is being saved. -->
  <form action="{% url 'MainApp:edit_entry' entry.id %}" method='post'>
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Save changes" %}
  </form>

{% endblock content %}
