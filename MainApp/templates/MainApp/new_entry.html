{% extends "MainApp/base.html" %}

{% load bootstrap4 %}

{% block page_header %}
  <!-- The topic name is a link back to that topic's page. topic.id works
       because the view passed the whole topic object in the context. -->
  <h2><a href="{% url 'MainApp:topic' topic.id %}">{{ topic }}</a></h2>
{% endblock page_header %}

{% block content %}

  <p>Add a new entry:</p>

  <!-- The new_entry URL needs the topic id, so it is passed here too. -->
  <form action="{% url 'MainApp:new_entry' topic.id %}" method='post'>
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Add entry" %}
  </form>

{% endblock content %}
