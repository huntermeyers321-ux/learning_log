{% extends "MainApp/base.html" %}

{% load bootstrap4 %}

{% block page_header %}
  <h2>Register an account.</h2>
{% endblock page_header %}

{% block content %}

  <!-- This form uses Django's built-in UserCreationForm. Our own register
       view handles the redirect, so no hidden "next" field is needed here. -->
  <form action="{% url 'users:register' %}" method='post'>
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Register" %}
  </form>

{% endblock content %}
